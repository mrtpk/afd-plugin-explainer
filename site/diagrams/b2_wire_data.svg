<text x="30.0" y="604.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The transfers are custom ops (afd_p2p_send / afd_p2p_recv and the _group variants) so they stay traceable under torch.compile and CUDA graph capture (p2p.py:979-1122).</text>
<text x="30.0" y="622.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">With one peer the single slice is the whole tensor; no concat or split happens.</text>
