<text x="30.0" y="674.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Router logits are consumed only when the FFN runner gate is None; AFD clears it so the runner uses external routing (deepseek_v2.py:548-553, :714-721).</text>
<text x="30.0" y="692.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Qwen3-MoE requires compute_gate_on_attention=false, so it always ships the whole MoE block (qwen3_moe.py:84-87).</text>
