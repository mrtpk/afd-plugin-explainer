<text x="30.0" y="808.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">On CUDA every MoE layer uses the remote-experts shell (uses_remote_experts, :444); GateOnlyRemoteMoE is the NPU gate-on-attention path.</text>
<text x="30.0" y="826.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The FFN role keeps the gate weights loadable but clears the runner gate on CUDA, so it consumes the attention-side router logits (:548-553).</text>
