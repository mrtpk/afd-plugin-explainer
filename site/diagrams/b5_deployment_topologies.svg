<text x="30.0" y="772.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Eager variants pass --enforce-eager; graph variants pass --compilation-config cudagraph_mode=FULL_DECODE_ONLY.</text>
<text x="30.0" y="790.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Start order: launch both roles, wait for &#x27;Application startup complete&#x27; in each log, then send traffic to the attention HTTP port.</text>
