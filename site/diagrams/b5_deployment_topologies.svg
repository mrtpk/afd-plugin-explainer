<text x="730.0" y="492.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU3  ·  role=ffn  ·  18304</text>
<rect x="46.0" y="454.0" width="656.0" height="52.0" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="60.0" y="484.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Not the A/F split:</text>
<text x="180.5" y="484.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">the proxy and prefillers handle prefill/decode (NIXL KV), not attention/FFN.</text>
<rect x="20.0" y="540.0" width="1060.0" height="168.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="566.0" r="13" fill="#111827"/>
<text x="46.0" y="570.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">3</text>
<text x="68.0" y="571.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Multipod (k8s): one pod per role, gated on POD</text>
<text x="68.0" y="590.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Each vllm serve is wrapped in if [ &quot;$POD&quot; == ... ]. With POD unset, nothing runs.</text>
<rect x="46.0" y="610.0" width="320.0" height="70.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="58.0" y="630.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">2A2F multipod</text>
<text x="58.0" y="648.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">POD=ATTENTION_0 | FFN_0</text>
<text x="58.0" y="663.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">DP1 TP2 each  ·  2 pods</text>
<rect x="382.0" y="610.0" width="340.0" height="70.0" rx="8" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.5"/>
<text x="394.0" y="630.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Qwen3.5 122B FP8 (4A2F)</text>
<text x="394.0" y="648.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">ATTENTION_0 + ATTENTION_1 + FFN_0</text>
<text x="394.0" y="663.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">DP4 (DP2 local x2) / DP2  ·  3 pods</text>
<rect x="738.0" y="610.0" width="316.0" height="70.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="750.0" y="630.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">The rule</text>
<text x="750.0" y="648.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">attention: A = DP x TP</text>
<text x="750.0" y="663.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">ffn: F = DP x TP  ·  A &gt;= F</text>
