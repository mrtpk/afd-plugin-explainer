<text x="394.0" y="416.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU0, GPU1  ·  NIXL kv_producer</text>
<rect x="718.0" y="378.0" width="336.0" height="56.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="730.0" y="398.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Decode attention</text>
<text x="730.0" y="416.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU2  ·  role=attention  ·  18303</text>
<line x1="886.0" y1="434.0" x2="886.0" y2="454.0" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#m0)"/>
