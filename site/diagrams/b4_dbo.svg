<text x="30.0" y="542.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Exactly two stages: enable_dbo sets num_ubatches = 2; the validator rejects any other count (validation.py:126-131).</text>
